name: Update flag ids

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  update_db:
    runs-on: ubuntu-latest

    permissions:
        contents: write
        pull-requests: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Update FLAG IDs
        run: uv run python scripts/update_flagids.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: db_update
          commit-message: "[skip ci] Update flag ids."
          title: Update flag ids
          body: Automated FLAG ID database update from https://www.dlms.com/flag-id-directory/ by DLMS UA.
          add-paths: |
            custom_components/dlms_cosem/dlms_flagids.json
